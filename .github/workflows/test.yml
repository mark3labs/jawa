name: Test and lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./...
      - name: Verify generated templates are current
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1070 generate ./internal/orchestrator
          git diff --exit-code -- internal/orchestrator
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/orchestrator/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: internal/orchestrator/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:browser
      - run: npx playwright install --with-deps chromium
      - name: Browser fixtures with bundled Chromium
        run: |
          JAWA_AUTO_MERGE_HTML="$PWD/node_modules/.auto-merge.html" go test ../../../internal/orchestrator -run '^TestAutoMergeBrowserFixture$' -count=1
          JAWA_AUTO_MERGE_HTML="$PWD/node_modules/.auto-merge.html" npm run test:auto-merge
          JAWA_MERGE_HTML="$PWD/node_modules/.merge.html" go test ../../../internal/orchestrator -run '^TestMergeUIFixture$' -count=1
          npm run test:merge
          npm run test:fix
          npm run test:agents
          JAWA_ASSIGNMENT_HTML="$PWD/node_modules/.assignment.html" go test ../../../internal/orchestrator -run '^TestAssignmentUIFixture$' -count=1
          JAWA_ASSIGNMENT_HTML="$PWD/node_modules/.assignment.html" npm run test:assignment-ui
          npm run test:guidance
          npm run test:pr-refresh
          npm run test:issues
          JAWA_COMPONENT_FIXTURE="$PWD/node_modules/.components.html" go test ../../../internal/orchestrator -run 'Test(ComponentBrowserFixture|PlanningComponentFixture|AgentsComponentFixture)$' -count=1
          JAWA_COMPONENT_FIXTURE="$PWD/node_modules/.components.html" npm run test:components
          JAWA_RUN_DETAIL_HTML="$PWD/node_modules/.run-detail" go test ../../../internal/orchestrator -run '^TestRunDetailVisualFixture$' -count=1
          JAWA_RUN_DETAIL_HTML="$PWD/node_modules/.run-detail" npm run test:run-detail
          JAWA_CARD_VISUAL_HTML="$PWD/node_modules/.cards.html" go test ../../../internal/orchestrator -run '^TestCardVisualFixture$' -count=1
          JAWA_CARD_VISUAL_HTML="$PWD/node_modules/.cards.html" npm run test:cards
          JAWA_CARD_VISUAL_HTML="$PWD/node_modules/.cards.html" JAWA_COMPONENT_FIXTURE="$PWD/node_modules/.components.html" npm run test:ui
          JAWA_ISSUE_FIXTURE="$PWD/node_modules/.issues.html" go test ../../../internal/orchestrator -run '^TestIssueRecoveryFixture$' -count=1
          JAWA_ISSUE_FIXTURE="$PWD/node_modules/.issues.html" npm run test:issue-recovery
